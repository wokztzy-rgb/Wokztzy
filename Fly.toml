app = 'wokztzy'
primary_region = 'iad'

[build]
  builder = 'paketocommunity/builder:base'
  buildpacks = ['gcp/python']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = "tcp"
  internal_port = 8080
  [[services.ports]]
    port = 80, 443
    
